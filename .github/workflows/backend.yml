name: Backend checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: JavaScript syntax checks
        shell: bash
        run: find server -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: git diff --check
